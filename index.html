<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent Maker Pro</title>
    
    <script>
        (function() {
            if (document.cookie.indexOf('googtrans') === -1) {
                let userLang = navigator.language || navigator.userLanguage;
                let shortLang = userLang.split('-')[0].toLowerCase();
                if (userLang.toLowerCase() === 'zh-cn' || userLang.toLowerCase() === 'zh-tw') shortLang = 'zh-CN';
                const ondersteundeTalen = ['en', 'de', 'fr', 'es', 'it', 'pt', 'pl', 'ru', 'tr', 'ar', 'zh-CN', 'ja', 'ko', 'hi'];
                if (ondersteundeTalen.includes(shortLang) && shortLang !== 'nl') {
                    document.cookie = 'googtrans=/nl/' + shortLang + '; path=/';
                    document.cookie = 'googtrans=/nl/' + shortLang + '; domain=.' + location.hostname + '; path=/';
                }
            }
        })();
    </script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #e2e8f0; margin: 0; padding: 30px; min-height: 100vh; box-sizing: border-box; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid #334155; height: fit-content; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 25px; }
        .title h1 { margin: 0; color: #38bdf8; font-size: 26px; font-weight: 600; }
        .title p { margin: 5px 0 0 0; font-size: 13px; color: #94a3b8; }
        .badge { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        
        .lang-menu { position: relative; display: inline-block; cursor: pointer; }
        .lang-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #e2e8f0; padding: 5px; transition: transform 0.2s; }
        .lang-btn:hover { transform: scale(1.1); }
        .lang-dropdown { display: none; position: absolute; right: 0; top: 35px; background: #1e293b; min-width: 180px; max-height: 350px; overflow-y: auto; box-shadow: 0 8px 25px rgba(0,0,0,0.7); z-index: 10; border-radius: 8px; border: 1px solid #334155; }
        .lang-menu:hover .lang-dropdown { display: block; }
        .lang-dropdown a { color: #e2e8f0; padding: 12px 15px; text-decoration: none; display: block; font-size: 13px; transition: background 0.2s; font-weight: 500; }
        .lang-dropdown a:hover { background: #3b82f6; color: white; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #e2e8f0; }
        
        .server-browser { background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; border-radius: 12px; height: 280px; display: flex; flex-direction: column; overflow: hidden; }
        .browser-header { background: #334155; padding: 8px 12px; font-size: 12px; font-family: monospace; color: #cbd5e1; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .browser-header button { background: #475569; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background 0.2s;}
        .browser-header button:hover { background: #64748b; }
        .browser-list { flex: 1; overflow-y: auto; padding: 5px; }
        .browser-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .browser-item:hover { background: rgba(59, 130, 246, 0.2); }
        .browser-item .name { display: flex; align-items: center; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .item-checkbox { cursor: pointer; width: 16px; height: 16px; margin-right: 8px; accent-color: #10b981; }
        
        .btn-add-queue { background: #10b981; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-add-queue:hover { background: #059669; }

        textarea { width: 100%; background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; color: #e2e8f0; padding: 12px; border-radius: 8px; box-sizing: border-box; font-family: monospace; transition: border-color 0.3s ease; height: 280px; resize: none; font-size: 12px; line-height: 1.5; }
        textarea:focus { outline: none; border-color: #3b82f6; }
        
        .btn { background: linear-gradient(to right, #6366f1, #3b82f6); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: opacity 0.3s; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn:hover { opacity: 0.9; }
        
        .job-list { margin-top: 25px; max-height: 250px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; background: rgba(15, 23, 42, 0.5); padding: 10px; display: none; }
        .job-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #1e293b; font-size: 13px; }
        .job-item:last-child { border-bottom: none; }
        .job-name { color: #cbd5e1; font-weight: 500; }
        
        .status-wachtend { color: #94a3b8; }
        .status-bezig { color: #fbbf24; font-weight: bold; }
        .status-klaar { color: #10b981; font-weight: bold; }
        .status-fout { color: #ef4444; font-weight: bold; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .update-badge { display: none; background: #10b981; color: white; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }
        .update-badge:hover { background: #059669; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        .toggle-old-btn { display: none; background: #334155; color: white; border: 1px solid #475569; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-delete { background: none; border: none; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: background 0.2s; opacity: 0.7; margin-left: 5px; }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.2); opacity: 1; }
        
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(16px); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
        .modal { background: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; border: 1px solid #334155; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .modal h2 { margin-top: 0; color: #38bdf8; font-size: 20px; margin-bottom: 20px; }
        .modal input, .modal textarea { font-family: 'Segoe UI', sans-serif; font-size: 14px; margin-bottom: 15px; width: 100%; box-sizing: border-box; background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; color: #e2e8f0; padding: 10px; border-radius: 8px;}
        .modal p { color: #e2e8f0; font-size: 14px; margin-bottom: 20px; line-height: 1.5; white-space: pre-wrap; }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 5px; }
        .btn-cancel { background: #475569; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-send { background: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .webhook-input { width: 100%; background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; color: #e2e8f0; padding: 8px 12px; border-radius: 8px; box-sizing: border-box; font-family: monospace; font-size: 12px; margin-top: 5px; transition: border-color 0.3s; }
        .webhook-input:focus { outline: none; border-color: #3b82f6; }

        /* Voorkom dat de vertaalbalk de layout naar beneden verschuift */
        body { top: 0px !important; position: static !important; }

        /* Verberg alle varianten van Google's bovenbalk en iframes */
        iframe.skiptranslate,
        .goog-te-banner-frame,
        .goog-te-banner-frame.skiptranslate,
        .VIpgJd-ZVi9I-OR9ErZ-OEVmcd { 
            display: none !important; 
            visibility: hidden !important; 
        }

        /* Verberg hover pop-ups, tekstballonnen en markeringen */
        #goog-gt-tt,
        .goog-te-balloon-frame { 
            display: none !important; 
        }

        .goog-text-highlight { 
            background-color: transparent !important; 
            box-shadow: none !important; 
            border: none !important; 
        }

        #google_translate_element { 
            display: none !important; 
        }
    </style>
</head>
<body>

<div id="google_translate_element"></div>
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'nl', autoDisplay: false}, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- Nette Melding Pop-up -->
<div class="modal-overlay" id="customAlertModal">
    <div class="modal">
        <h2 id="customAlertTitle">Melding</h2>
        <p id="customAlertText"></p>
        <div class="modal-buttons">
            <button class="btn-send" onclick="document.getElementById('customAlertModal').style.display='none'">OK</button>
        </div>
    </div>
</div>

<!-- Contact Modal -->
<div class="modal-overlay" id="contactModal">
    <div class="modal">
        <h2 id="t_cTitle">Neem Contact Op</h2>
        <input type="text" id="contactName" placeholder="Jouw naam of email (optioneel)">
        <textarea id="contactMessage" placeholder="Typ hier je bericht of vraag..." style="height: 120px;"></textarea>
        <div class="modal-buttons">
            <button class="btn-cancel" id="t_cCancel" onclick="closeContact()">Annuleren</button>
            <button class="btn-send" id="t_cSend" onclick="verstuurContact()">Versturen</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="title">
            <h1>Torrent Maker Pro</h1>
            <p><span id="t_sub">Ontwikkeld door</span> <b>PandaBoyNL</b></p>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span id="t_badge">Live-Sync Motor Actief</span>
            </div>
            
            <a href="https://paypal.me/PandaBoyNL" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background-color: #FFDD00; color: #333333; text-decoration: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; font-size: 13px; box-shadow: 0px 4px 6px rgba(0,0,0,0.2); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
              ☕ Buy me a coffee
            </a>

            <button class="lang-btn" onclick="openContact()" title="Contact opnemen">💬</button>

            <div class="lang-menu">
                <button class="lang-btn">🌍</button>
                <div class="lang-dropdown" id="lang-lijst"></div>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="col">
            <label><b id="t_step1">1. Verken Unraid Server (/data)</b></label>
            <div class="server-browser">
                <div class="browser-header">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button onclick="navigeerTerug()" title="Map omhoog">⬅️</button>
                        <span id="huidige-pad-weergave">/data</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label style="margin: 0; color: #cbd5e1; display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11px;">
                            <input type="checkbox" id="selectAllItems" onclick="toggleSelecteerAlles()"> Alles
                        </label>
                        <button class="btn-add-queue" onclick="voegGeselecteerdeToe()" style="padding: 4px 8px; font-size: 11px;">➕ Selectie</button>
                    </div>
                </div>
                <div class="browser-list" id="browser-lijst"></div>
            </div>
            
            <p style="font-size: 12px; color: #94a3b8; margin-top: 10px;">
                💾 .torrent bestanden worden automatisch opgeslagen in <b>/storage</b>.
            </p>

            <div style="display: flex; align-items: center; margin-top: 15px; gap: 10px;">
                <label class="switch" title="Zet dit uit als je een tragere server hebt">
                    <input type="checkbox" id="turboToggle" checked>
                    <span class="slider"></span>
                </label>
                <span style="font-size: 13px; color: #94a3b8;" id="t_turbo">Turbo Modus (5 tegelijk bij >50)</span>
            </div>
            
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #334155;">
                <label style="font-size: 12px; color: #94a3b8;"><b style="color: #e2e8f0;">🔔 Discord Notificatie</b> (Webhook URL - Optioneel):</label>
                <input type="text" id="discordWebhookUrl" class="webhook-input" placeholder="https://discord.com/api/webhooks/..." onchange="slaWebhookOp()">
            </div>
        </div>

        <div class="col">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label style="margin: 0;"><b id="t_step3">2. Trackers</b></label>
                <div style="display: flex; gap: 8px;">
                    <button id="toggleOldTrackersBtn" class="toggle-old-btn" onclick="toggleOudeLijst()">Bekijk Oude Lijst</button>
                    <div id="trackerUpdateKnop" class="update-badge" onclick="pasNieuweTrackersToe()">Update Beschikbaar! 🔄</div>
                </div>
            </div>
            <textarea id="trackers" spellcheck="false"></textarea>
        </div>
    </div>

    <!-- UI voor de Wachtrij -->
    <div class="job-list" id="job-lijst"></div>
    <button class="btn" id="startBtn" style="display: none;"></button>
</div>

<script>
    // --- STANDAARD FUNCTIES ---
    function toonMelding(titel, tekst) {
        document.getElementById('customAlertTitle').innerText = titel;
        document.getElementById('customAlertText').innerText = tekst;
        document.getElementById('customAlertModal').style.display = 'flex';
    }

    const talen = { "nl": "🇳🇱 Nederlands", "en": "🇺🇸 English", "de": "🇩🇪 Deutsch", "fr": "🇫🇷 Français", "es": "🇪🇸 Español", "it": "🇮🇹 Italiano", "pt": "🇵🇹 Português", "pl": "🇵🇱 Polski", "ru": "🇷🇺 Русский", "tr": "🇹🇷 Türkçe", "ar": "🇸🇦 العربية", "zh-CN": "🇨🇳 中文", "ja": "🇯🇵 日本語", "ko": "🇰🇷 한국어", "hi": "🇮🇳 हिन्दी" };
    function laadTalenMenu() { const lijst = document.getElementById('lang-lijst'); if (!lijst) return; lijst.innerHTML = ''; for (const [code, naam] of Object.entries(talen)) { const a = document.createElement('a'); a.href = "#"; a.innerText = naam; a.onclick = (e) => { e.preventDefault(); document.cookie = `googtrans=/nl/${code}; path=/`; document.cookie = `googtrans=/nl/${code}; domain=.${location.hostname}; path=/`; const sel = document.querySelector(".goog-te-combo"); if (sel) { sel.value = code; sel.dispatchEvent(new Event('change')); } else { window.location.reload(); } }; lijst.appendChild(a); } }

    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1540418081996939336/kcVnOs8WCDy9DMZhH53pVtSSUMhHlxEiFTas9trnoEXIj04zhE2n87RicFdJ0l9qg_Q1";
    function openContact() { document.getElementById('contactModal').style.display = 'flex'; }
    function closeContact() { document.getElementById('contactModal').style.display = 'none'; }
    async function verstuurContact() { const msg = document.getElementById('contactMessage').value.trim(); const nm = document.getElementById('contactName').value.trim() || "Anonieme Gebruiker"; if (!msg) return toonMelding("Fout", "Je bericht is leeg!"); const btn = document.getElementById('t_cSend'); const orig = btn.innerText; btn.innerText = "⏳..."; btn.disabled = true; try { const ans = await fetch(DISCORD_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: `🔔 **Nieuw Bericht**\n**Van:** ${nm}\n**Bericht:**\n\`\`\`\n${msg}\n\`\`\`` }) }); if(ans.ok || ans.status === 204) { toonMelding("Succes", "✅ Verzonden!"); document.getElementById('contactMessage').value = ""; closeContact(); } else throw new Error(); } catch (f) { toonMelding("Fout", "❌ Mislukt."); } btn.innerText = orig; btn.disabled = false; }

    let huidigeMapPad = '/data';
    window.huidigeBestandenLijst = []; 

    async function laadMap(pad) {
        document.getElementById('browser-lijst').innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">Laden... ⏳</div>';
        try {
            const res = await fetch('/api/verkenner', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pad: pad }) });
            const data = await res.json();
            if (data.success) {
                huidigeMapPad = data.huidigeMap; document.getElementById('huidige-pad-weergave').innerText = huidigeMapPad;
                tekenVerkenner(data.bestanden);
            } else { toonMelding("Fout", data.error); if(pad !== '/data') laadMap('/data'); }
        } catch (e) { document.getElementById('browser-lijst').innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444;">Fout bij verbinden met server.</div>'; }
    }

    function tekenVerkenner(bestanden) {
        const lijst = document.getElementById('browser-lijst'); lijst.innerHTML = ''; document.getElementById('selectAllItems').checked = false; 
        if(bestanden.length === 0) return lijst.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">Deze map is leeg.</div>';
        window.huidigeBestandenLijst = bestanden; 
        bestanden.forEach((b, index) => {
            const div = document.createElement('div'); div.className = 'browser-item';
            const chk = document.createElement('input'); chk.type = 'checkbox'; chk.className = 'item-checkbox'; chk.value = index; chk.onclick = (e) => e.stopPropagation();
            const nameContainer = document.createElement('div'); nameContainer.className = 'name'; nameContainer.appendChild(chk);
            const tekstSpan = document.createElement('span'); tekstSpan.innerHTML = `&nbsp;${b.isMap ? '📁' : '📄'} ${b.naam}`;
            tekstSpan.style.cursor = b.isMap ? 'pointer' : 'default';
            if(b.isMap) tekstSpan.onclick = (e) => { e.stopPropagation(); laadMap(b.pad); };
            nameContainer.appendChild(tekstSpan);
            const addBtn = document.createElement('button'); addBtn.className = 'btn-add-queue'; addBtn.innerText = '➕'; addBtn.onclick = (e) => { e.stopPropagation(); voegToeAanWachtrij(b.pad, b.naam, false); };
            div.appendChild(nameContainer); div.appendChild(addBtn); lijst.appendChild(div);
        });
    }

    function navigeerTerug() { if (huidigeMapPad === '/data') return; const delen = huidigeMapPad.split('/'); delen.pop(); laadMap(delen.join('/') || '/'); }
    function toggleSelecteerAlles() { const isChecked = document.getElementById('selectAllItems').checked; document.querySelectorAll('.item-checkbox').forEach(chk => chk.checked = isChecked); }
    function voegGeselecteerdeToe() {
        const checkboxes = document.querySelectorAll('.item-checkbox:checked');
        if(checkboxes.length === 0) return toonMelding("Melding", "Je hebt niks aangevinkt!");
        checkboxes.forEach(chk => { const b = window.huidigeBestandenLijst[chk.value]; voegToeAanWachtrij(b.pad, b.naam, true); chk.checked = false; });
        document.getElementById('selectAllItems').checked = false;
    }


    // --- 🔥 HET NIEUWE LIVE-SYNC SYSTEEM 🔥 ---

    let lokaleWachtrij = [];  // Bestanden die je zojuist hebt aangeklikt
    let serverWachtrij = [];  // Bestanden waar de server mee bezig is of klaar mee is

    // 1. Haal elke 2 seconden de stand van zaken op van de server
    async function syncMetServer() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            serverWachtrij = data.taken;
            tekenWachtrij();
        } catch(e) {}
    }
    setInterval(syncMetServer, 2000); // Polling (Live Updates)

    function voegToeAanWachtrij(pad, naam, isMassa = false) {
        if(lokaleWachtrij.find(t => t.pad === pad) || serverWachtrij.find(t => t.pad === pad)) {
            if(!isMassa) toonMelding("Melding", "Bestand staat al in de wachtrij!");
            return;
        }
        lokaleWachtrij.push({ id: 'job_' + Date.now() + Math.random(), pad: pad, naam: naam, status: 'nieuw' });
        tekenWachtrij();
    }

    function verwijderLokaal(id) {
        lokaleWachtrij = lokaleWachtrij.filter(t => t.id !== id);
        tekenWachtrij();
    }

    // 2. Teken de actuele stand van zaken op het scherm
    function tekenWachtrij() {
        const comboLijst = [...serverWachtrij, ...lokaleWachtrij];
        const lijstDiv = document.getElementById('job-lijst');
        const startBtn = document.getElementById('startBtn');

        if (comboLijst.length === 0) {
            lijstDiv.style.display = 'none';
            startBtn.style.display = 'none';
            return;
        }

        lijstDiv.style.display = 'block';
        lijstDiv.innerHTML = '';

        let heeftNieuw = false;
        let isBezigOpServer = false;
        let heeftKlaar = false;

        comboLijst.forEach(taak => {
            if (taak.status === 'nieuw') heeftNieuw = true;
            if (taak.status === 'wachtend' || taak.status === 'bezig') isBezigOpServer = true;
            if (taak.status === 'klaar' || taak.status === 'fout') heeftKlaar = true;

            let statusHTML = '';
            let verwijderKnopHTML = '';

            if (taak.status === 'nieuw') {
                statusHTML = '<span class="status-wachtend">📝 Wacht op start...</span>';
                verwijderKnopHTML = `<button class="btn-delete" onclick="verwijderLokaal('${taak.id}')" title="Verwijder">❌</button>`;
            } else if (taak.status === 'wachtend') {
                statusHTML = '<span class="status-wachtend">⏳ Server: In de rij</span>';
            } else if (taak.status === 'bezig') {
                statusHTML = '<span class="status-bezig">⚙️ Server: Bezig...</span>';
            } else if (taak.status === 'klaar') {
                statusHTML = '<span class="status-klaar">✅ Klaar</span>';
            } else if (taak.status === 'fout') {
                statusHTML = '<span class="status-fout">❌ Fout</span>';
            }

            const div = document.createElement('div');
            div.className = 'job-item';
            div.innerHTML = `<span class="job-name">🎯 ${taak.naam}</span> 
                             <div style="display: flex; align-items: center; gap: 10px;">
                                 ${statusHTML} ${verwijderKnopHTML}
                             </div>`;
            lijstDiv.appendChild(div);
        });

        // 3. Pas de grote actieknop aan op basis van wat de server aan het doen is
        startBtn.style.display = 'block';
        startBtn.disabled = false;

        if (heeftNieuw) {
            startBtn.innerText = '🚀 Start Genereren';
            startBtn.onclick = stuurNaarServer;
            startBtn.style.background = 'linear-gradient(to right, #6366f1, #3b82f6)';
        } else if (isBezigOpServer) {
            startBtn.innerText = '⚙️ Server Bezig (Afsluiten = Veilig)';
            startBtn.onclick = null;
            startBtn.style.background = '#475569';
            startBtn.disabled = true;
        } else if (heeftKlaar) {
            startBtn.innerText = '✨ Wis Voltooide Taken';
            startBtn.onclick = wisVoltooideTakenOpServer;
            startBtn.style.background = 'linear-gradient(to right, #10b981, #059669)';
        }
    }

    // 4. Stuur het lijstje naar de server
    async function stuurNaarServer() {
        if (lokaleWachtrij.length === 0) return;
        
        const btn = document.getElementById('startBtn');
        btn.innerText = '☁️ Verzenden naar server...';
        btn.disabled = true;

        const isTurboAan = document.getElementById('turboToggle').checked;
        const trackers = toonOudeLijst ? localStorage.getItem('mijnTorrentTrackers') : document.getElementById('trackers').value;
        const webhookUrl = document.getElementById('discordWebhookUrl').value.trim();

        try {
            await fetch('/api/maak-batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taken: lokaleWachtrij, trackers: trackers, webhookUrl: webhookUrl, turbo: isTurboAan })
            });
            lokaleWachtrij = []; // Alles is overgedragen aan de server
            syncMetServer(); // Haal direct de nieuwe status op
        } catch (e) {
            toonMelding("Fout", "Kan niet verbinden met de server.");
        }
    }

    // 5. Ruim de lijst op de server op (als alles klaar is)
    async function wisVoltooideTakenOpServer() {
        try {
            await fetch('/api/wis-voltooid', { method: 'POST' });
            syncMetServer(); // Haal direct de opgeschoonde lijst op
        } catch(e) {}
    }


    // --- OVERIGE INSTELLINGEN (Webhook & Trackers) ---
    function slaWebhookOp() { localStorage.setItem('gebruikerDiscordWebhook', document.getElementById('discordWebhookUrl').value.trim()); }
    async function laadInstellingen() { try { const res = await fetch('/api/settings'); const data = await res.json(); const lokaal = localStorage.getItem('gebruikerDiscordWebhook'); const veld = document.getElementById('discordWebhookUrl'); if (data.webhook) { veld.value = data.webhook; localStorage.setItem('gebruikerDiscordWebhook', data.webhook); } else if (lokaal) { veld.value = lokaal; } } catch (e) {} }

    const TRACKER_URL = 'https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all.txt';
    let onlineTrackers = ""; let toonOudeLijst = false;

    async function controleerTrackers() {
        const trackerVeld = document.getElementById('trackers'); const lokaal = localStorage.getItem('mijnTorrentTrackers'); const oud = localStorage.getItem('oudeTorrentTrackers');
        if (lokaal) trackerVeld.value = lokaal; if (oud) document.getElementById('toggleOldTrackersBtn').style.display = 'block';
        try {
            const antw = await fetch(TRACKER_URL + '?t=' + Date.now());
            if (antw.ok) {
                onlineTrackers = (await antw.text()).split(/\r?\n/).map(r => r.trim()).filter(r => r !== '').join('\n\n');
                if (!lokaal) pasNieuweTrackersToe(); else if (onlineTrackers !== lokaal) document.getElementById('trackerUpdateKnop').style.display = 'block';
            }
        } catch (e) { if(!lokaal) trackerVeld.value = "Fout bij ophalen trackers."; }
    }
    function pasNieuweTrackersToe() { const trackerVeld = document.getElementById('trackers'); if(trackerVeld.value && trackerVeld.value !== onlineTrackers) { localStorage.setItem('oudeTorrentTrackers', trackerVeld.value); document.getElementById('toggleOldTrackersBtn').style.display = 'block'; } trackerVeld.value = onlineTrackers; localStorage.setItem('mijnTorrentTrackers', onlineTrackers); document.getElementById('trackerUpdateKnop').style.display = 'none'; }
    function toggleOudeLijst() { toonOudeLijst = !toonOudeLijst; const btn = document.getElementById('toggleOldTrackersBtn'); const veld = document.getElementById('trackers'); if(toonOudeLijst) { veld.value = localStorage.getItem('oudeTorrentTrackers') || ''; veld.style.borderColor = '#ef4444'; btn.style.background = '#ef4444'; btn.innerText = "Huidige Lijst"; } else { veld.value = localStorage.getItem('mijnTorrentTrackers') || ''; veld.style.borderColor = '#334155'; btn.style.background = '#334155'; btn.innerText = "Oude Lijst"; } }

    laadTalenMenu();
    laadInstellingen(); 
    controleerTrackers();
    laadMap('/data'); 
    syncMetServer(); // Haal bij opstarten direct de server-status op!
</script>
</body>
</html>
